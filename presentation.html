              <h4 class="font-bold text-lg text-[#0F3B82]">✅ 驗收清單全數通過</h4>
              <ul class="text-xs text-slate-700 space-y-2">
                <li class="flex items-center gap-2"><span class="text-emerald-600 font-bold">✔</span> <b>1. LINE@ 結合 LINE LIFF 作品</b>：支援 24h 最新新聞、防重複、主題與時間設定、立即更新。</li>
                <li class="flex items-center gap-2"><span class="text-emerald-600 font-bold">✔</span> <b>2. HTML 互動點擊簡報 + Canva 簡報</b>：完整解答 (a) 怎麼用它 (b) 怎麼回報問題，並支援一鍵下載。</li>
                <li class="flex items-center gap-2"><span class="text-emerald-600 font-bold">✔</span> <b>3. Message API + Cloudflare 免費 AI</b>：支援 LINE 聊天室與 LIFF 網頁內雙向 AI 免費問答。</li>
              </ul>
            </div>
            <div class="flex flex-col space-y-2.5 w-full md:w-72">
              <a href="index.html" class="w-full bg-[#0F3B82] hover:bg-blue-800 text-white font-bold py-3 px-4 rounded-xl text-xs text-center shadow transition">
                🚀 立即前往 LINE LIFF 實機作品
              </a>
              <a href="downloads/AI_News_LIFF_Canva_Slides.pptx" download="AI_產業情報專刊_Canva簡報.pptx" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-4 rounded-xl text-xs text-center shadow transition">
                📥 下載 Canva PowerPoint (.pptx)
              </a>
              <a href="downloads/AI_News_LIFF_Canva_Slides.pdf" download="AI_產業情報專刊_Canva簡報.pdf" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 px-4 rounded-xl text-xs text-center shadow transition">
                📄 下載 Canva PDF 簡報 (.pdf)
              </a>
            </div>
          </div>
        `
      }
    ];

    let currentSlide = 0;
    let viewMode = "html"; // 'html' or 'canva'

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      renderDots();
      renderCurrentSlide();
      bindEvents();
    });

    function renderDots() {
      const container = document.getElementById("dots-container");
      container.innerHTML = SLIDES_DATA.map((_, idx) => `
        <button data-index="${idx}" class="slide-dot w-2.5 h-2.5 rounded-full transition-all ${idx === currentSlide ? 'bg-blue-400 w-6' : 'bg-white/30 hover:bg-white/60'}" title="第 ${idx + 1} 頁"></button>
      `).join("");

      document.querySelectorAll(".slide-dot").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          currentSlide = parseInt(btn.dataset.index, 10);
          renderCurrentSlide();
        });
      });
    }

    function renderCurrentSlide() {
      const slide = SLIDES_DATA[currentSlide];
      const htmlContainer = document.getElementById("html-slide-content");
      const canvaContainer = document.getElementById("canva-slide-content");
      const canvaImg = document.getElementById("canva-slide-img");

      if (viewMode === "html") {
        htmlContainer.classList.remove("hidden");
        canvaContainer.classList.add("hidden");
        canvaContainer.classList.remove("flex");

        htmlContainer.innerHTML = `
          <div class="space-y-2 border-b border-slate-100 pb-4">
            <span class="inline-block text-[11px] font-bold tracking-wider text-[#2563EB] bg-blue-50 px-3 py-1 rounded-full border border-blue-200/60">
              ${slide.badge}
            </span>
            <h2 class="text-xl sm:text-2xl md:text-3xl font-extrabold text-[#0F3B82] leading-tight">
              ${slide.title}
            </h2>
            <p class="text-xs sm:text-sm text-slate-500 font-medium">
              ${slide.subtitle}
            </p>
          </div>
          ${slide.contentHtml}
        `;
      } else {
        htmlContainer.classList.add("hidden");
        canvaContainer.classList.remove("hidden");
        canvaContainer.classList.add("flex");
        canvaImg.src = `slides/slide_${currentSlide + 1}.png`;
      }

      document.getElementById("slide-page-indicator").innerText = `Slide ${currentSlide + 1} / ${SLIDES_DATA.length}`;
      document.getElementById("prev-btn").disabled = currentSlide === 0;
      document.getElementById("next-btn").disabled = currentSlide === SLIDES_DATA.length - 1;

      renderDots();
      lucide.createIcons();
    }

    function bindEvents() {
      document.getElementById("prev-btn").addEventListener("click", () => {
        if (currentSlide > 0) {
          currentSlide--;
          renderCurrentSlide();
        }
      });

      document.getElementById("next-btn").addEventListener("click", () => {
        if (currentSlide < SLIDES_DATA.length - 1) {
          currentSlide++;
          renderCurrentSlide();
        }
      });

      // 點擊簡報畫布左右切換
      document.getElementById("slide-stage").addEventListener("click", (e) => {
        if (e.target.closest("a") || e.target.closest("button")) return;
        const rect = e.currentTarget.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        if (clickX < rect.width * 0.35) {
          if (currentSlide > 0) {
            currentSlide--;
            renderCurrentSlide();
          }
        } else {
          if (currentSlide < SLIDES_DATA.length - 1) {
            currentSlide++;
            renderCurrentSlide();
          }
        }
      });

      // 鍵盤左右方向鍵支援
      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight" || e.key === " ") {
          if (currentSlide < SLIDES_DATA.length - 1) {
            currentSlide++;
            renderCurrentSlide();
          }
        } else if (e.key === "ArrowLeft") {
          if (currentSlide > 0) {
            currentSlide--;
            renderCurrentSlide();
          }
        }
      });

      // 切換 HTML 互動模式 vs Canva 原稿模式
      const htmlBtn = document.getElementById("mode-html-btn");
      const canvaBtn = document.getElementById("mode-canva-btn");

      htmlBtn.addEventListener("click", () => {
        viewMode = "html";
        htmlBtn.className = "px-3 py-1 rounded-lg text-xs font-bold bg-[#2563EB] text-white transition flex items-center space-x-1";
        canvaBtn.className = "px-3 py-1 rounded-lg text-xs font-bold text-blue-200 hover:text-white transition flex items-center space-x-1";
        renderCurrentSlide();
      });

      canvaBtn.addEventListener("click", () => {
        viewMode = "canva";
        canvaBtn.className = "px-3 py-1 rounded-lg text-xs font-bold bg-[#2563EB] text-white transition flex items-center space-x-1";
        htmlBtn.className = "px-3 py-1 rounded-lg text-xs font-bold text-blue-200 hover:text-white transition flex items-center space-x-1";
        renderCurrentSlide();
      });

      // 全螢幕按鈕
      document.getElementById("fullscreen-btn").addEventListener("click", () => {
        const stage = document.getElementById("slide-stage");
        if (!document.fullscreenElement) {
          stage.requestFullscreen?.();
        } else {
          document.exitFullscreen?.();
        }
      });

      // 一鍵下載獨立 HTML 簡報檔 (支援 iPhone iOS Safari / LINE LIFF / 電腦全平台)
      document.getElementById("download-html-btn").addEventListener("click", async (e) => {
        const isCloudflareWorker = location.hostname.endsWith(".workers.dev") || location.hostname.endsWith(".pages.dev");
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

        // 在 Cloudflare 網域上，直接由 Worker 回傳 Content-Disposition: attachment 觸發 iPhone 原生下載視窗 (與 PPTX 完全相同機制)
        if (isCloudflareWorker) {
          return; // 讓 <a href="downloads/AI_News_Interactive_Slides.html" download> 直接觸發伺服器附件下載
        }

        // 若在靜態預覽網域 (如 github.io) 或本地開啟：
        e.preventDefault();
        const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
        const fileName = "AI_產業情報專刊_互動式簡報.html";

        // iPhone / iOS 優先呼叫原生「分享 / 儲存到檔案」面板
        if (isIOS && navigator.canShare) {
          try {
            const file = new File([htmlContent], fileName, { type: "text/html" });
            if (navigator.canShare({ files: [file] })) {
              await navigator.share({
                files: [file],
                title: "AI 產業情報專刊 — 互動式簡報",
                text: "點擊「儲存到檔案」即可下載 HTML 簡報"
              });
              return;
            }
          } catch (err) {
            if (err && err.name === "AbortError") return;
          }
        }

        // 桌機與一般瀏覽器：延遲 60 秒再釋放 Blob URL，避免手機端非同步下載被中斷
        const blob = new Blob([htmlContent], { type: "application/octet-stream" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 60000);
      });
    }
  </script>
